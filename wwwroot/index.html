<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.css">
    <link rel="stylesheet" href="https://unpkg.com/inspire-tree-dom@4.0.6/dist/inspire-tree-light.min.css">
    <link rel="stylesheet" href="/main.css">
    <title>Autodesk Platform Services: Data Exchange Walls Connector</title>
</head>

<body>
    <div id="header">
        <img class="logo" src="https://cdn.autodesk.io/logo/black/stacked.png" alt="Autodesk Platform Services">
        <span class="title">Data Exchange Walls Connector</span>
        <button id="login" style="visibility: hidden;">Login</button>
    </div>
    <div id="sidebar">
        <div id="tree"></div>
        <div id="walls-panel" class="disabled">
            <h3>Walls</h3>
            <p id="walls-hint">Select a version in the tree to load it.</p>
            <div class="row">
                <label for="wall-height">Height (<span class="unit">ft</span>)</label>
                <input id="wall-height" type="number" min="0" step="any" value="10">
            </div>
            <div class="row">
                <label for="wall-thickness">Thickness (<span class="unit">ft</span>)</label>
                <input id="wall-thickness" type="number" min="0" step="any" value="0.66">
            </div>
            <div class="row">
                <label for="wall-color">Color</label>
                <input id="wall-color" type="color" value="#c8c8c8">
            </div>
            <div class="row buttons">
                <button id="draw-walls">Draw walls</button>
                <button id="undo-wall">Undo</button>
                <button id="clear-walls">Clear</button>
            </div>
            <div class="row">
                <label for="exchange-name">Exchange name</label>
                <input id="exchange-name" type="text" placeholder="Walls">
            </div>
            <div class="row buttons">
                <button id="submit-walls" class="primary">Submit as new exchange</button>
            </div>
            <p id="walls-status"></p>
        </div>
    </div>
    <div id="preview"></div>
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://unpkg.com/inspire-tree@4.3.1/dist/inspire-tree.js"></script>
    <script src="https://unpkg.com/inspire-tree-dom@4.0.6/dist/inspire-tree-dom.min.js"></script>
    <script src="/main.js" type="module"></script>
</body>

</html>
